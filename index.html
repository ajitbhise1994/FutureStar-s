<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Star Classes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b1f3b; --muted:#5d6280;
  --brand:#2b2f77; --star:#f2b705; --line:#dedbd0; --danger:#b3261e; --ok:#1e7a46;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14162b; --card:#1d2040; --ink:#f1f0ea; --muted:#a9acc8; --brand:#8d92ff; --line:#33376a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari',system-ui,sans-serif;line-height:1.6;padding-bottom:40px}
h1,h2,h3{font-family:'Baloo 2','Noto Sans Devanagari',sans-serif;margin:0;line-height:1.25}
header{background:var(--brand);color:#fff;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media (prefers-color-scheme:dark){header{background:#262a5e}}
header h1{font-size:1.4rem;font-weight:800}
header h1 span{color:var(--star)}
header small{display:block;font-family:'Noto Sans Devanagari',sans-serif;font-weight:400;font-size:.8rem;opacity:.85}
main{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;min-height:44px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.btn{background:var(--star);color:#1b1f3b;font-weight:600}
.btn-ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);min-height:38px;padding:4px 12px}
.batch-list{display:grid;gap:12px;margin-top:8px}
.batch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:16px;border-radius:14px}
.batch:hover{border-color:var(--brand)}
.batch .ic{font-size:1.8rem;width:52px;height:52px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.batch b{font-family:'Baloo 2',sans-serif;font-size:1.15rem;display:block}
.batch span{color:var(--muted);font-size:.85rem}
.back{background:none;color:var(--brand);padding:6px 0;min-height:36px;font-weight:600}
@media (prefers-color-scheme:dark){.back{color:var(--star)}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:5px;border-radius:12px;margin:12px 0}
.tab{background:transparent;color:var(--ink);font-weight:600}
.tab[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item h3{font-size:1.05rem}
.item a.go{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:8px 16px;border-radius:10px;font-weight:600}
.item iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:10px;background:#000}
.empty{color:var(--muted);text-align:center;padding:28px 10px;border:1.5px dashed var(--line);border-radius:12px}
.admin-box{background:var(--card);border:1.5px solid var(--star);border-radius:14px;padding:14px;margin-bottom:14px}
.admin-box h3{font-size:1rem;margin-bottom:8px}
input[type=text],input[type=url],input[type=password]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.dialog-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;z-index:10}
.dialog-bg.open{display:grid}
.dialog{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px}
.msg{min-height:1.4em;font-size:.9rem;margin:4px 0}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools button{font-size:.85rem;min-height:38px;padding:6px 12px}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <h1 id="homeTitle">Future <span>Star</span> Classes<small>अजित सर यांचे क्लासेस</small></h1>
  <button class="btn btn-ghost" id="adminBtn" style="color:#fff">अजित सर लॉगिन</button>
</header>

<main>
  <!-- Home: batch folders -->
  <section id="home">
    <h2>तुमची बॅच निवडा</h2>
    <div class="batch-list" id="batchList"></div>
  </section>

  <!-- Batch view -->
  <section id="batchView" class="hidden">
    <button class="back" id="backBtn">‹ सर्व बॅचेस</button>
    <h2 id="batchName"></h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabZoom" aria-selected="true">🎥 Zoom लाईव्ह क्लास</button>
      <button class="tab" role="tab" id="tabYt" aria-selected="false">▶️ YouTube व्हिडिओ</button>
    </div>

    <div class="admin-box hidden" id="adminForm">
      <h3 id="formTitle">नवीन लिंक जोडा</h3>
      <input type="text" id="inTitle" placeholder="शीर्षक (उदा. सोमवार संध्या ६ वा.)">
      <input type="url" id="inUrl" placeholder="लिंक येथे पेस्ट करा (https://...)">
      <button class="btn" id="addBtn">लिंक जतन करा</button>
      <div class="msg" id="formMsg" role="status"></div>
      <div class="msg" id="syncMsg" role="status"></div>
    </div>

    <div id="items"></div>
  </section>

  <!-- Admin tools -->
  <section id="adminTools" class="hidden">
    <div class="admin-box">
      <h3>अजित सर – डेटा साधने</h3>
      <p class="hint" style="margin:0 0 6px">तुम्ही टाकलेली माहिती याच फोनमध्ये सेव्ह होते. विद्यार्थ्यांना दिसण्यासाठी "डेटा एक्सपोर्ट" करून <b>data.json</b> फाईल GitHub मध्ये अपलोड करा.</p>
      <div class="tools">
        <button class="btn" id="exportBtn">⬇ डेटा एक्सपोर्ट (data.json)</button>
        <button class="btn-ghost btn" id="importBtn">⬆ इम्पोर्ट</button>
        <button class="btn-danger" id="resetBtn">रीसेट</button>
        <button class="btn-ghost btn" id="logoutBtn">लॉगआउट</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      <div class="msg" id="toolMsg" role="status"></div>
      <div class="msg" id="syncMsg2" role="status"></div>
      <h3 style="margin-top:14px">ऑटो-सेव्ह (GitHub) – एकदाच सेटिंग</h3>
      <input type="text" id="ghOwner" placeholder="GitHub युजरनेम (उदा. Anwriter)" autocapitalize="off">
      <input type="text" id="ghRepo" placeholder="Repository नाव (उदा. futurestarclasses)" autocapitalize="off">
      <input type="password" id="ghToken" placeholder="GitHub टोकन (github_pat_...)" autocomplete="off">
      <button class="btn" id="ghSave">सेटिंग जतन करा</button>
    </div>
  </section>
</main>

<!-- Login dialog -->
<div class="dialog-bg" id="loginBg">
  <div class="dialog" role="dialog" aria-labelledby="lgT">
    <h3 id="lgT">अजित सर लॉगिन</h3>
    <p class="hint">पासवर्ड टाका</p>
    <input type="password" id="pw" placeholder="पासवर्ड" inputmode="numeric" autocomplete="off">
    <div class="msg err" id="lgMsg" role="alert"></div>
    <div class="tools">
      <button class="btn" id="lgOk">लॉगिन</button>
      <button class="btn-ghost btn" id="lgCancel">रद्द करा</button>
    </div>
  </div>
</div>

<script>
(function(){
  var ADMIN_PASSWORD = "1234";          // पासवर्ड बदलायचा असल्यास येथे बदला
  var LS_DATA = "fsc_data_v1", LS_ADMIN = "fsc_admin_v1";

  var BATCHES = [
    {id:"se-basic",   name:"स्पोकन इंग्लिश – Basic",   sub:"Spoken English", icon:"🗣️"},
    {id:"se-advance", name:"स्पोकन इंग्लिश – Advance", sub:"Spoken English", icon:"🎤"},
    {id:"maths",      name:"गणित",                     sub:"Mathematics",    icon:"➗"},
    {id:"navodaya",   name:"नवोदय",                    sub:"Navodaya Vidyalaya", icon:"🎓"}
  ];

  var data = {}, isAdmin = false, curBatch = null, curTab = "zoom";
  var $ = function(id){return document.getElementById(id);};

  /* ---------- storage ---------- */
  function emptyData(){
    var d = {}; BATCHES.forEach(function(b){ d[b.id] = {zoom:[], yt:[]}; }); return d;
  }
  function normalize(d){
    var out = emptyData();
    if(d && typeof d === "object"){
      BATCHES.forEach(function(b){
        if(d[b.id]){
          out[b.id].zoom = Array.isArray(d[b.id].zoom) ? d[b.id].zoom : [];
          out[b.id].yt   = Array.isArray(d[b.id].yt)   ? d[b.id].yt   : [];
        }
      });
    }
    return out;
  }
  var LS_GH = "fsc_gh_v1", pushTimer = null;
  function ghCfg(){ try{ return JSON.parse(localStorage.getItem(LS_GH)); }catch(e){ return null; } }
  function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
  function syncStatus(text, ok){
    ["syncMsg","syncMsg2"].forEach(function(id){
      var el = $(id); if(el){ el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
    });
  }
  function pushGH(){
    var c = ghCfg(); if(!c || !c.token || !c.owner || !c.repo) return;
    syncStatus("GitHub वर पाठवत आहे…", true);
    var url = "https://api.github.com/repos/" + c.owner + "/" + c.repo + "/contents/data.json";
    var h = {"Authorization":"Bearer " + c.token, "Accept":"application/vnd.github+json"};
    fetch(url + "?t=" + Date.now(), {headers:h})
      .then(function(r){ return r.status === 404 ? null : r.json(); })
      .then(function(j){
        var body = {message:"Update data.json", content:b64(JSON.stringify(data, null, 2))};
        if(j && j.sha) body.sha = j.sha;
        return fetch(url, {method:"PUT", headers:h, body:JSON.stringify(body)});
      })
      .then(function(r){
        if(r.ok) syncStatus("✔ GitHub वर सेव्ह झाले. विद्यार्थ्यांना १-२ मिनिटांत दिसेल.", true);
        else syncStatus("GitHub वर पाठवता आले नाही (कोड " + r.status + "). टोकन/नाव तपासा.", false);
      })
      .catch(function(){ syncStatus("इंटरनेट अडचण. पुन्हा प्रयत्न करा.", false); });
  }
  function save(){
    try{ localStorage.setItem(LS_DATA, JSON.stringify(data)); }catch(e){}
    clearTimeout(pushTimer); pushTimer = setTimeout(pushGH, 700);
  }
  function load(cb){
    var local = null;
    try{ local = JSON.parse(localStorage.getItem(LS_DATA)); }catch(e){}
    if(local){ data = normalize(local); cb(); return; }
    // विद्यार्थ्यांसाठी: GitHub वरील data.json वाचतो
    fetch("data.json?v=" + Date.now())
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ data = normalize(j); cb(); })
      .catch(function(){ data = emptyData(); cb(); });
  }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function safeUrl(u){
    u = (u||"").trim();
    if(!/^https?:\/\//i.test(u)) u = "https://" + u;
    try{ var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; }
  }
  function ytId(u){
    var m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : "";
  }
  function show(id, on){ $(id).classList.toggle("hidden", !on); }
  function flash(el, text, ok){
    el.textContent = text; el.className = "msg " + (ok ? "ok" : "err");
    setTimeout(function(){ el.textContent = ""; }, 3500);
  }

  /* ---------- rendering ---------- */
  function renderHome(){
    $("batchList").innerHTML = BATCHES.map(function(b){
      var n = data[b.id].zoom.length + data[b.id].yt.length;
      return '<button class="batch" data-id="'+b.id+'"><div class="ic">'+b.icon+'</div><div><b>'+esc(b.name)+'</b><span>'+esc(b.sub)+' • '+n+' लिंक</span></div></button>';
    }).join("");
    Array.prototype.forEach.call($("batchList").children, function(el){
      el.onclick = function(){ openBatch(el.getAttribute("data-id")); };
    });
  }
  function openBatch(id){
    curBatch = id; curTab = "zoom";
    var b = BATCHES.filter(function(x){return x.id===id;})[0];
    $("batchName").textContent = b.icon + " " + b.name;
    show("home", false); show("batchView", true);
    renderTabs(); renderItems(); applyAdmin(); window.scrollTo(0,0);
  }
  function renderTabs(){
    $("tabZoom").setAttribute("aria-selected", curTab==="zoom");
    $("tabYt").setAttribute("aria-selected", curTab==="yt");
    $("formTitle").textContent = curTab==="zoom" ? "नवीन Zoom क्लास लिंक जोडा" : "नवीन YouTube व्हिडिओ लिंक जोडा";
    $("inTitle").placeholder = curTab==="zoom" ? "शीर्षक (उदा. सोमवार संध्या ६ वा.)" : "शीर्षक (उदा. Lesson 1 – Tenses)";
    $("inUrl").placeholder = curTab==="zoom" ? "Zoom लिंक पेस्ट करा" : "YouTube लिंक पेस्ट करा";
  }
  function renderItems(){
    var list = data[curBatch][curTab];
    var box = $("items");
    if(!list.length){
      box.innerHTML = '<div class="empty">' + (curTab==="zoom" ? "सध्या कोणताही लाईव्ह क्लास जोडलेला नाही." : "सध्या कोणताही व्हिडिओ जोडलेला नाही.") + '</div>';
      return;
    }
    box.innerHTML = list.map(function(it, i){
      var h = '<div class="item"><div class="row"><h3>'+esc(it.t)+'</h3><div class="row">';
      if(curTab==="zoom"){
        h += '<a class="go" href="'+esc(it.u)+'" target="_blank" rel="noopener">Zoom जॉईन करा</a>';
      }else{
        h += '<button class="btn" data-play="'+i+'">▶ पहा</button>';
      }
      if(isAdmin) h += '<button class="btn-danger" data-del="'+i+'" aria-label="डिलीट">🗑</button>';
      h += '</div></div><div id="pl'+i+'"></div></div>';
      return h;
    }).join("");
  }

  /* ---------- events ---------- */
  $("items").addEventListener("click", function(e){
    var t = e.target.closest("button"); if(!t) return;
    if(t.hasAttribute("data-del")){
      var i = +t.getAttribute("data-del");
      if(confirm("ही लिंक डिलीट करायची का?")){
        data[curBatch][curTab].splice(i,1); save(); renderItems();
      }
    }else if(t.hasAttribute("data-play")){
      var j = +t.getAttribute("data-play"), it = data[curBatch].yt[j], slot = $("pl"+j);
      if(slot.innerHTML){ slot.innerHTML = ""; t.textContent = "▶ पहा"; return; }
      var id = ytId(it.u);
      if(id){
        slot.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title="'+esc(it.t)+'"></iframe>';
        t.textContent = "✕ बंद करा";
      }else{
        window.open(it.u, "_blank", "noopener");
      }
    }
  });

  $("tabZoom").onclick = function(){ curTab="zoom"; renderTabs(); renderItems(); };
  $("tabYt").onclick   = function(){ curTab="yt";   renderTabs(); renderItems(); };
  $("backBtn").onclick = function(){ show("batchView", false); show("home", true); show("adminForm", false); renderHome(); window.scrollTo(0,0); };
  $("homeTitle").onclick = $("backBtn").onclick;

  $("addBtn").onclick = function(){
    var t = $("inTitle").value.trim(), u = safeUrl($("inUrl").value);
    if(!t){ flash($("formMsg"), "कृपया शीर्षक टाका.", false); return; }
    if(!u || $("inUrl").value.trim()===""){ flash($("formMsg"), "कृपया योग्य लिंक टाका.", false); return; }
    data[curBatch][curTab].unshift({t:t, u:u});
    save(); $("inTitle").value = ""; $("inUrl").value = "";
    flash($("formMsg"), "लिंक जतन झाली ✔", true); renderItems();
  };

  /* ---------- admin ---------- */
  function applyAdmin(){
    show("adminForm", isAdmin && curBatch !== null && !$("batchView").classList.contains("hidden"));
    show("adminTools", isAdmin);
    $("adminBtn").textContent = isAdmin ? "सर मोड ✔" : "अजित सर लॉगिन";
    if(curBatch && !$("batchView").classList.contains("hidden")) renderItems();
  }
  $("adminBtn").onclick = function(){
    if(isAdmin){ return; }
    $("pw").value = ""; $("lgMsg").textContent = "";
    $("loginBg").classList.add("open"); setTimeout(function(){ $("pw").focus(); }, 50);
  };
  $("lgCancel").onclick = function(){ $("loginBg").classList.remove("open"); };
  function doLogin(){
    if($("pw").value === ADMIN_PASSWORD){
      isAdmin = true;
      try{ localStorage.setItem(LS_ADMIN, "1"); }catch(e){}
      $("loginBg").classList.remove("open"); applyAdmin();
    }else{
      $("lgMsg").textContent = "पासवर्ड चुकीचा आहे. पुन्हा प्रयत्न करा.";
    }
  }
  $("lgOk").onclick = doLogin;
  $("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
  $("logoutBtn").onclick = function(){
    isAdmin = false; try{ localStorage.removeItem(LS_ADMIN); }catch(e){}
    $("adminBtn").textContent = "अजित सर लॉगिन"; applyAdmin();
  };

  $("exportBtn").onclick = function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "data.json";
    document.body.appendChild(a); a.click(); a.remove();
    flash($("toolMsg"), "data.json डाउनलोड झाली. ती GitHub मध्ये अपलोड करा.", true);
  };
  $("importBtn").onclick = function(){ $("importFile").click(); };
  $("importFile").onchange = function(){
    var f = this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{ data = normalize(JSON.parse(r.result)); save(); renderHome(); renderItems(); flash($("toolMsg"), "डेटा इम्पोर्ट झाला ✔", true); }
      catch(e){ flash($("toolMsg"), "फाईल वाचता आली नाही.", false); }
    };
    r.readAsText(f); this.value = "";
  };
  $("resetBtn").onclick = function(){
    if(confirm("या फोनमधील सर्व सेव्ह केलेला डेटा पुसायचा का?")){
      try{ localStorage.removeItem(LS_DATA); }catch(e){}
      data = emptyData(); renderHome(); if(curBatch) renderItems();
      flash($("toolMsg"), "डेटा रीसेट झाला.", true);
    }
  };

  var g = ghCfg();
  if(g){ $("ghOwner").value = g.owner || ""; $("ghRepo").value = g.repo || ""; $("ghToken").value = g.token || ""; }
  $("ghSave").onclick = function(){
    var c = {owner:$("ghOwner").value.trim(), repo:$("ghRepo").value.trim(), token:$("ghToken").value.trim()};
    if(!c.owner || !c.repo || !c.token){ flash($("toolMsg"), "तिन्ही माहिती भरा.", false); return; }
    try{ localStorage.setItem(LS_GH, JSON.stringify(c)); }catch(e){}
    flash($("toolMsg"), "सेटिंग जतन झाली. आता पाठवून तपासतो…", true);
    pushGH();
  };

  /* ---------- start ---------- */
  load(function(){
    try{ isAdmin = localStorage.getItem(LS_ADMIN) === "1"; }catch(e){}
    renderHome(); applyAdmin();
  });
})();
</script>
</body>
</html>
