<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>आमचा क्लास – अभ्यास साहित्य</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7385;--accent:#2f5fe3;--accent-t:#fff;--border:#e2e5ee;--danger:#d33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--text:#eef0f6;--muted:#9aa3b5;--accent:#6f93ff;--accent-t:#0d1220;--border:#2a3140;--danger:#ff7b7b}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--text:#eef0f6;--muted:#9aa3b5;--accent:#6f93ff;--accent-t:#0d1220;--border:#2a3140;--danger:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari","Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{padding:20px 16px 8px;max-width:720px;margin:0 auto}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
input,select,button{font:inherit}
input[type=text],select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:10px}
.item h3{margin:0 0 2px;font-size:1rem}
.meta{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:var(--accent-t);padding:10px 16px;border-radius:10px;cursor:pointer;text-decoration:none;font-size:.9rem;display:inline-block}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.admin{background:var(--card);border:1px dashed var(--accent);border-radius:14px;padding:14px;margin:8px 0}
.admin h2{font-size:1rem;margin:0 0 10px}
.admin>*+*{margin-top:8px}
.msg{font-size:.85rem;color:var(--muted)}
#viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#viewer.show{display:flex}
.vbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--card)}
.vbar .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<header>
  <h1>📚 आमचा क्लास – अभ्यास साहित्य</h1>
  <div class="sub">सर्व PDF एकाच ठिकाणी – टॅप करा आणि वाचा</div>
</header>
<main>
  <div id="admin" class="admin" hidden>
    <h2>👩‍🏫 शिक्षक विभाग – नवीन PDF जोडा</h2>
    <input type="text" id="aTitle" placeholder="PDF चे नाव (उदा. गणित – प्रकरण 3)">
    <input type="text" id="aSubject" placeholder="विषय (उदा. गणित, विज्ञान)" list="subjList">
    <datalist id="subjList"></datalist>
    <input type="file" id="aFile" accept="application/pdf">
    <button class="btn" id="aBtn">⬆️ अपलोड करा</button>
    <div class="msg" id="aMsg"></div>
  </div>

  <input type="text" id="search" placeholder="🔍 PDF शोधा…">
  <div class="chips" id="chips"></div>
  <div id="list"><div class="empty">लोड होत आहे…</div></div>
</main>

<div id="viewer">
  <div class="vbar">
    <button class="btn alt" id="vClose">← मागे</button>
    <div class="t" id="vTitle"></div>
    <a class="btn" id="vOpen" target="_blank" rel="noopener">नवीन टॅब</a>
  </div>
  <iframe id="frame" title="PDF"></iframe>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var db=null, assets=null, user=null, isTeacher=false;
  var items=[], subject="सर्व", q="";

  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
  function mb(n){return n?(n/1048576).toFixed(1)+" MB":""}
  function url(it){return "/_blob/"+it.assetId}

  function render(){
    var subs=["सर्व"];
    items.forEach(function(i){if(i.subject&&subs.indexOf(i.subject)<0)subs.push(i.subject)});
    if(subs.indexOf(subject)<0)subject="सर्व";
    $("chips").innerHTML=subs.map(function(s){return '<button class="chip'+(s===subject?' on':'')+'" data-s="'+esc(s)+'">'+esc(s)+'</button>'}).join("");
    $("subjList").innerHTML=subs.filter(function(s){return s!=="सर्व"}).map(function(s){return '<option value="'+esc(s)+'">'}).join("");
    var f=items.filter(function(i){
      return (subject==="सर्व"||i.subject===subject)&&(!q||(i.title||"").toLowerCase().indexOf(q)>=0);
    });
    if(!f.length){$("list").innerHTML='<div class="empty">'+(items.length?'काहीही सापडले नाही':'अजून कोणतीही PDF जोडलेली नाही')+'</div>';return}
    $("list").innerHTML=f.map(function(i){
      return '<div class="item"><h3>📄 '+esc(i.title)+'</h3><div class="meta">'+esc(i.subject||"")+(i.size?' · '+mb(i.size):'')+'</div>'
        +'<div class="row"><button class="btn" data-open="'+esc(i.id)+'">वाचा</button>'
        +'<a class="btn alt" href="'+esc(url(i))+'" target="_blank" rel="noopener">नवीन टॅबमध्ये उघडा</a>'
        +(isTeacher?'<button class="btn del" data-del="'+esc(i.id)+'">हटवा</button>':'')
        +'</div></div>';
    }).join("");
  }

  $("chips").addEventListener("click",function(e){var s=e.target.getAttribute("data-s");if(s){subject=s;render()}});
  $("search").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();render()});
  $("list").addEventListener("click",function(e){
    var o=e.target.getAttribute("data-open"), d=e.target.getAttribute("data-del");
    var it=items.filter(function(i){return i.id===(o||d)})[0]; if(!it)return;
    if(o){
      $("vTitle").textContent=it.title; $("frame").src=url(it); $("vOpen").href=url(it);
      $("viewer").classList.add("show");
    } else if(d && confirm("ही PDF कायमची हटवायची?")){
      db.collection("pdfs").doc(it.id).delete().then(function(){
        if(assets&&it.assetId){return assets.delete(it.assetId)}
      }).catch(function(){alert("हटवता आले नाही")});
    }
  });
  $("vClose").onclick=function(){$("viewer").classList.remove("show");$("frame").src="about:blank"};

  $("aBtn").onclick=async function(){
    var file=$("aFile").files[0], title=$("aTitle").value.trim(), subj=$("aSubject").value.trim();
    var m=$("aMsg");
    if(!file||!title){m.textContent="नाव आणि PDF फाईल निवडा.";return}
    if(file.type!=="application/pdf"){m.textContent="फक्त PDF फाईल निवडा.";return}
    $("aBtn").disabled=true; m.textContent="अपलोड सुरू आहे…";
    try{
      var r=await assets.upload(file);
      await db.collection("pdfs").add({title:title,subject:subj||"इतर",assetId:r.id,size:r.sizeBytes,createdAt:Date.now()});
      m.textContent="✅ PDF जोडली गेली!";
      $("aTitle").value="";$("aFile").value="";
    }catch(err){
      m.textContent="❌ अपलोड अयशस्वी: "+((err&&err.message)||"पुन्हा प्रयत्न करा");
    }
    $("aBtn").disabled=false;
  };

  async function init(){
    try{ db=await claude.use("db"); }catch(e){db=null}
    if(!db){$("list").innerHTML='<div class="empty">कृपया लॉग इन करून पुन्हा उघडा.</div>';return}
    try{ user=await claude.use("user"); isTeacher=!!(user&&user.canEdit()); }catch(e){}
    if(isTeacher){
      try{ assets=await claude.use("assets"); }catch(e){}
      if(assets){$("admin").hidden=false}
    }
    db.collection("pdfs").orderBy("createdAt","desc").onSnapshot(function(snap){
      items=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
      render();
    },function(){$("list").innerHTML='<div class="empty">डेटा लोड करता आला नाही.</div>'});
  }
  init();
})();
</script>
</body>
</html>
